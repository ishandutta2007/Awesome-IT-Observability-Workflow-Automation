<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Accent Gradient for Glow -->
    <linearGradient id="accent-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Animated Data Stream Gradient -->
    <linearGradient id="stream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#a855f7;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#ec4899;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#38bdf8;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Drop Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pulse-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="340" rx="16" fill="url(#cyber-grid)" />

  <!-- DYNAMIC ANIMATED BACKGROUND ELEMENTS -->
  <!-- Telemetry Waves (Background Flow) -->
  <g opacity="0.35">
    <!-- Wave 1 -->
    <path fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 6" filter="url(#glow)">
      <animate attributeName="d" 
        dur="10s" 
        repeatCount="indefinite"
        values="
          M 0 100 Q 300 40 600 100 T 1200 100;
          M 0 100 Q 300 160 600 100 T 1200 100;
          M 0 100 Q 300 40 600 100 T 1200 100
        " />
    </path>
    <!-- Wave 2 -->
    <path fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 8" filter="url(#glow)">
      <animate attributeName="d" 
        dur="12s" 
        repeatCount="indefinite"
        values="
          M 0 250 Q 300 310 600 250 T 1200 250;
          M 0 250 Q 300 190 600 250 T 1200 250;
          M 0 250 Q 300 310 600 250 T 1200 250
        " />
    </path>
  </g>

  <!-- Flowing Pipeline Signals / Packets -->
  <g opacity="0.7">
    <!-- Flow Line Upper -->
    <line x1="100" y1="50" x2="1100" y2="50" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <circle r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="cx" from="100" to="1100" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="50;50" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#818cf8" filter="url(#glow)">
      <animate attributeName="cx" from="100" to="1100" dur="6s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="50;50" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Flow Line Lower -->
    <line x1="100" y1="290" x2="1100" y2="290" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <circle r="4" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="cx" from="1100" to="100" dur="5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="290;290" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#34d399" filter="url(#glow)">
      <animate attributeName="cx" from="1100" to="100" dur="7s" begin="2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="290;290" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Pulsing Nodes / Telemetry Indicators in background corners -->
  <g transform="translate(60, 40)">
    <circle r="12" fill="#06b6d4" opacity="0.15">
      <animate attributeName="r" values="8;16;8" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="5" fill="#06b6d4" />
  </g>
  <g transform="translate(1140, 40)">
    <circle r="12" fill="#a855f7" opacity="0.15">
      <animate attributeName="r" values="8;16;8" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle r="5" fill="#a855f7" />
  </g>
  <g transform="translate(60, 290)">
    <circle r="12" fill="#10b981" opacity="0.15">
      <animate attributeName="r" values="8;16;8" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="5" fill="#10b981" />
  </g>
  <g transform="translate(1140, 290)">
    <circle r="12" fill="#ec4899" opacity="0.15">
      <animate attributeName="r" values="8;16;8" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle r="5" fill="#ec4899" />
  </g>

  <!-- Dynamic Live Status Pill (Top Center Foreground) -->
  <g transform="translate(480, 25)">
    <rect width="240" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity="0.95" />
    <circle cx="20" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="35" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">SYSTEMS OBSERVABLE</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed Crisp & High-Contrast) -->
  <!-- Main Title -->
  <g transform="translate(600, 130)">
    <!-- Subtle Title Glow Backdrop -->
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#000" opacity="0.4" y="3" letter-spacing="-0.5">
      AWESOME IT OBSERVABILITY
    </text>
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#accent-cyan-purple)" letter-spacing="-0.5">
      AWESOME IT OBSERVABILITY
    </text>
  </g>

  <!-- Title Line 2: Workflow Automation & AIOps -->
  <g transform="translate(600, 180)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
      &amp; WORKFLOW AUTOMATION
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(600, 218)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Telemetry Stacks • AIOps Correlation • Event-Driven Auto-Remediation • Self-Healing IT
    </text>
  </g>

  <!-- Feature Pills (Bottom Foreground) -->
  <g transform="translate(240, 248)">
    <!-- Pill 1: OpenTelemetry -->
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="80" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">⚡ OpenTelemetry</text>

    <!-- Pill 2: Unified Telemetry -->
    <rect x="180" y="0" width="170" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.9" />
    <text x="265" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#818cf8">📊 Unified Telemetry</text>

    <!-- Pill 3: AIOps Incident Intelligence -->
    <rect x="370" y="0" width="180" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1" opacity="0.9" />
    <text x="460" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#c084fc">🤖 AIOps &amp; Noise Filter</text>

    <!-- Pill 4: Self-Healing Remediation -->
    <rect x="570" y="0" width="160" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.9" />
    <text x="650" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#34d399">🔄 Auto-Remediation</text>
  </g>
</svg>
